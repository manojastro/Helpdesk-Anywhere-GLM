<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Helpdesk Anywhere</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: #0f1419;
        color: #e6e8ea;
      }
      button {
        background: #2d6cdf; color: #fff; border: none; border-radius: 6px;
        padding: 8px 16px; font-size: 14px; cursor: pointer;
      }
      button:hover { background: #3d7cef; }
      button:disabled { background: #2a3138; color: #6b7480; cursor: not-allowed; }
      button.danger { background: #c0392b; }
      button.danger:hover { background: #d94a3c; }
      input, select {
        background: #1a2129; color: #e6e8ea; border: 1px solid #2d3640;
        border-radius: 6px; padding: 8px 12px; font-size: 14px;
      }
      .card {
        background: #151c24; border: 1px solid #232d38; border-radius: 10px;
        padding: 20px;
      }
      .muted { color: #8a94a0; }
      .mono { font-family: 'Cascadia Code', 'Consolas', monospace; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
